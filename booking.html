<body>
    <div id="site-header"></div>

    <!-- Main Content -->
    <main id="main-content" tabindex="-1" role="main">
        <!-- Booking Section -->
        <section class="section" id="booking">
            <div class="container">
                <h1 class="section-title graffiti-text">הזמן זמן</h1>
                <div class="card" style="max-width: 600px; margin: 0 auto;">
                    <div id="booking-status" role="status" aria-live="polite" style="margin-bottom: 1rem;"></div>

                    <form class="booking-form" id="booking-form">
                        <div class="form-group">
                            <label for="booking-name">שם מלא *</label>
                            <input type="text" id="booking-name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="booking-email">אימייל *</label>
                            <input type="email" id="booking-email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="booking-date">תאריך *</label>
                            <input type="date" id="booking-date" name="date" required>
                        </div>

                        <div class="form-group">
                            <label for="booking-time">שעת התחלה *</label>
                            <input type="time" id="booking-time" name="time" required>
                        </div>

                        <div class="form-group">
                            <label for="booking-duration">משך הזמן (שעות) *</label>
                            <select id="booking-duration" name="duration" required>
                                <option value="">בחר משך זמן</option>
                                <option value="1">שעה אחת</option>
                                <option value="1.5">שעה וחצי</option>
                                <option value="2">שעתיים</option>
                                <option value="3">3 שעות</option>
                                <option value="4">4 שעות</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="booking-timezone">אזור זמן *</label>
                            <select id="booking-timezone" name="timezone" required>
                                <option value="Asia/Jerusalem">ישראל (Asia/Jerusalem)</option>
                                <option value="Europe/London">לונדון (Europe/London)</option>
                                <option value="America/New_York">ניו יורק (America/New_York)</option>
                                <option value="America/Los_Angeles">לוס אנג'לס (America/Los_Angeles)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="booking-notes">הערות נוספות</label>
                            <textarea id="booking-notes" name="notes" rows="3" placeholder="פרטים נוספים על ההזמנה"></textarea>
                        </div>

                        <button type="submit" class="cta-button" style="width: 100%;">הזמן זמן</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
