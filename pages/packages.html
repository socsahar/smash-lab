<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בחר חבילה - SmashLabs</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="packages-page.css">
</head>

<body>
    <a href="#main" class="skip-to-content" style="position:absolute;top:-100%;left:50%;transform:translateX(-50%);background:var(--primary,#ff6b00);color:#fff;padding:0.75rem 1.5rem;border-radius:8px;z-index:100000;font-weight:600;text-decoration:none;transition:top 0.3s;" onfocus="this.style.top='1rem'" onblur="this.style.top='-100%'">דלג לתוכן הראשי</a>

    <div class="packages-page">
        <header id="site-header"></header>

        <main class="packages-main">
            <section class="packages-hero">
                <h1>יאללה אז בוא נסגור חבילה</h1>
                <h2 class="packages-subtitle">מי מגיע לשחק?</h2>
            </section>

            <section class="packages-grid">
                <article class="package-card" role="button" tabindex="0" aria-label="קוביה 1: מגיע לבד - צריך את הזמן של עצמי" data-cube="solo" onclick="navigateToPackage('solo')">
                    <div class="package-card-header">
                        <h3>קוביה 1</h3>
                        <p class="package-card-title">מגיע לבד</p>
                    </div>
                    <p class="package-card-text">צריך את הזמן של עצמי</p>
                </article>

                <article class="package-card" role="button" tabindex="0" aria-label="קוביה 2: מגיע בזוג - מגיעים לפתור בעיות" data-cube="couple" onclick="navigateToPackage('couple')">
                    <div class="package-card-header">
                        <h3>קוביה 2</h3>
                        <p class="package-card-title">מגיע בזוג</p>
                    </div>
                    <p class="package-card-text">מגיעים לפתור בעיות</p>
                </article>

                <article class="package-card" role="button" tabindex="0" aria-label="קוביה 3: משפחתי - 4-5 משתתפים" data-cube="family" onclick="navigateToPackage('family')">
                    <div class="package-card-header">
                        <h3>קוביה 3</h3>
                        <p class="package-card-title">משפחתי</p>
                    </div>
                    <p class="package-card-text">4-5 משתתפים</p>
                </article>

                <article class="package-card" role="button" tabindex="0" aria-label="קוביה 4: בנדה - מעל 5 משתתפים" data-cube="group" onclick="navigateToPackage('group')">
                    <div class="package-card-header">
                        <h3>קוביה 4</h3>
                        <p class="package-card-title">בנדה</p>
                    </div>
                    <p class="package-card-text">מעל 5 משתתפים</p>
                </article>
            </section>
        </main>
    </div>

    <footer id="site-footer" role="contentinfo">
        <div style="padding: 1rem; background: rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
            <p style="font-size: 0.85rem; color: var(--muted); opacity: 0.7; margin: 0;">Developed by <a href="https://sanda-uinc.onrender.com/" target="_blank" rel="noopener noreferrer" style="color: var(--primary); text-decoration: none; font-weight: 500;" aria-label="sand (נפתח בחלון חדש)">sand</a></p>
        </div>
    </footer>

    <script src="../js/header-inject.js"></script>
    <script src="../js/cookie-manager.js"></script>
    <script src="../js/whatsapp-widget.js"></script>
    <script src="packages.js"></script>
</body>

</html>
