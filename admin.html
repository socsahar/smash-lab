<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה - SmashLabs Admin</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/admin-dashboard.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            font-family: 'Heebo', 'Rubik', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        .admin-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 3px solid #ff6b00;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b00, #1fb6c2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-user-name {
            color: #1fb6c2;
            font-weight: 600;
        }

        .btn-logout {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-logout:hover {
            transform: scale(1.05);
        }

        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            font-size: 1.2rem;
            color: #999;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Popular Package & Stats Section Styles */
        .popular-package,
        .upcoming-bookings,
        .today-bookings {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 107, 0, 0.2);
        }

        .subsection-title {
            font-size: 1.5rem;
            color: #ff6b00;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .package-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .package-name {
            font-size: 1.3rem;
            color: white;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .package-count {
            font-size: 1.8rem;
            color: #ffd700;
            font-weight: bold;
        }

        .bookings-table-wrapper {
            overflow-x: auto;
        }

        .bookings-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .bookings-table thead {
            background: rgba(255, 107, 0, 0.2);
        }

        .bookings-table th {
            padding: 15px;
            text-align: right;
            color: #ff6b00;
            font-weight: 600;
        }

        .bookings-table td {
            padding: 12px 15px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bookings-table tbody tr {
            transition: background 0.3s ease;
        }

        .bookings-table tbody tr:hover {
            background: rgba(255, 107, 0, 0.1);
        }

        .status-badge,
        .payment-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-badge.confirmed {
            background: #4caf50;
            color: white;
        }

        .status-badge.pending {
            background: #ff9800;
            color: white;
        }

        .status-badge.completed {
            background: #2196f3;
            color: white;
        }

        .status-badge.cancelled {
            background: #f44336;
            color: white;
        }

        .payment-badge.paid {
            background: #4caf50;
            color: white;
        }

        .payment-badge.pending {
            background: #ff9800;
            color: white;
        }

        .payment-badge.refunded {
            background: #9c27b0;
            color: white;
        }

        .payment-badge.failed {
            background: #f44336;
            color: white;
        }

        .rage-room { color: #ff6b00; }
        .throwing-axes { color: #4caf50; }
        .paint-room { color: #e91e63; }
        .combo { color: #9c27b0; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.1), rgba(31, 182, 194, 0.1));
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 107, 0, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6b00;
        }

        .stat-label {
            color: #999;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 2rem;
            color: #ff6b00;
            margin-bottom: 20px;
        }

        .revenue-section {
            margin-bottom: 30px;
        }

        .stat-card.success {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(76, 175, 80, 0.2));
            border-color: rgba(76, 175, 80, 0.3);
        }

        .stat-card.success .stat-value {
            color: #4caf50;
        }

        .stat-card.warning {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.1), rgba(255, 152, 0, 0.2));
            border-color: rgba(255, 152, 0, 0.3);
        }

        .stat-card.warning .stat-value {
            color: #ff9800;
        }

        .stat-card.info {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.1), rgba(33, 150, 243, 0.2));
            border-color: rgba(33, 150, 243, 0.3);
        }

        .stat-card.info .stat-value {
            color: #2196f3;
        }

        .bookings-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border-right: 4px solid;
        }

        .booking-card.rage-room {
            border-color: #ff6b00;
        }

        .booking-card.throwing-axes {
            border-color: #4caf50;
        }

        .booking-card.paint-room {
            border-color: #e91e63;
        }

        .booking-time {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1fb6c2;
        }

        .booking-package {
            font-size: 1.1rem;
            margin: 10px 0;
        }

        .booking-customer {
            color: #999;
        }

        .booking-status {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .no-bookings {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        /* Calendar Styles */
        .calendar-header {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 107, 0, 0.2);
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .view-controls {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
        }

        .view-btn:hover {
            background: rgba(255, 107, 0, 0.2);
            border-color: #ff6b00;
        }

        .view-btn.active {
            background: linear-gradient(45deg, #ff6b00, #1fb6c2);
            border-color: #ff6b00;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .date-navigation {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .current-date-label {
            font-size: 1.3rem;
            color: #ff6b00;
            font-weight: 700;
            min-width: 200px;
            text-align: center;
        }

        .nav-btn {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: rgba(255, 107, 0, 0.2);
            border-color: #ff6b00;
            transform: scale(1.05);
        }

        .today-btn {
            background: linear-gradient(45deg, #1fb6c2, #00a8b5);
            border-color: #1fb6c2;
        }

        .today-btn:hover {
            background: linear-gradient(45deg, #00a8b5, #008c96);
        }

        .calendar-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid;
        }

        .calendar-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 107, 0, 0.2);
        }

        .calendar-grid {
            display: grid;
            gap: 10px;
        }

        .month-view {
            grid-template-columns: repeat(7, 1fr);
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 700;
            color: #ff6b00;
            padding: 10px;
            background: rgba(255, 107, 0, 0.1);
            border-radius: 8px;
        }

        .calendar-day {
            min-height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff6b00;
        }

        .calendar-day.today {
            background: rgba(255, 107, 0, 0.1);
            border: 2px solid #ff6b00;
        }

        .calendar-day.other-month {
            opacity: 0.4;
        }

        .calendar-day.empty {
            cursor: default;
            background: transparent;
            border: none;
        }

        .day-number {
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .day-bookings {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .calendar-booking {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid;
        }

        .calendar-booking:hover {
            transform: translateX(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .calendar-booking.rage-room {
            background: rgba(255, 107, 0, 0.2);
            border-color: #ff6b00;
            color: #fff;
        }

        .calendar-booking.throwing-axes {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #fff;
        }

        .calendar-booking.paint-room {
            background: rgba(233, 30, 99, 0.2);
            border-color: #e91e63;
            color: #fff;
        }

        .calendar-booking.combo {
            background: rgba(156, 39, 176, 0.2);
            border-color: #9c27b0;
            color: #fff;
        }

        .more-bookings {
            font-size: 0.7rem;
            color: #1fb6c2;
            text-align: center;
            padding: 4px;
            font-weight: 600;
        }

        /* Day View Styles */
        .day-view {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        .hour-slot {
            display: flex;
            gap: 15px;
            min-height: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 0;
        }

        .hour-label {
            min-width: 80px;
            font-weight: 700;
            color: #ff6b00;
            font-size: 1.1rem;
            padding-top: 5px;
            text-align: right;
        }

        .hour-bookings {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .empty-hour {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
            padding: 10px;
            text-align: center;
        }

        .day-view .calendar-booking {
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .day-view .booking-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1fb6c2;
        }

        .day-view .booking-package {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .day-view .booking-customer,
        .day-view .booking-phone {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .booking-badges {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .status-badge,
        .payment-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.confirmed {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .status-badge.pending {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .status-badge.cancelled {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .payment-badge.paid {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .payment-badge.pending {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .payment-badge.failed {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            border: 1px solid #f44336;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border: 2px solid rgba(255, 107, 0, 0.3);
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 2px solid rgba(255, 107, 0, 0.3);
            background: rgba(255, 107, 0, 0.1);
        }

        .modal-header h2 {
            margin: 0;
            color: #ff6b00;
            font-size: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 107, 0, 0.2);
            color: #ff6b00;
            transform: rotate(90deg);
        }

        .booking-details {
            padding: 25px;
        }

        .detail-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 4px solid #ff6b00;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section h3 {
            color: #ff6b00;
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 107, 0, 0.3);
        }

        .detail-section p {
            color: #fff;
            margin: 10px 0;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.8;
        }

        .detail-section p strong {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            min-width: 120px;
        }

        .detail-section .status-badge,
        .detail-section .payment-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ff6b00;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group select {
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff6b00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 12px center;
            background-size: 16px;
            padding-left: 40px;
        }

        .form-group select option {
            background: #1a1a1a;
            color: #fff;
            padding: 10px;
        }

        .form-group select option:checked,
        .form-group select option:focus {
            background: #ff6b00;
            color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 107, 0, 0.3);
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b00, #ff8800);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #ff8800, #ffa500);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .calendar-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .view-controls,
            .date-navigation {
                width: 100%;
                justify-content: center;
            }

            .current-date-label {
                font-size: 1.1rem;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
            }

            .booking-details {
                padding: 15px;
            }

            .detail-section {
                padding: 15px;
            }

            .detail-section p {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .detail-section p strong {
                min-width: auto;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-header-left">
            <div class="admin-logo">SmashLabs Admin</div>
        </div>
        <div class="admin-header-right">
            <div class="admin-user">
                <span>👤</span>
                <span class="admin-user-name" id="adminName">מנהל</span>
            </div>
            <a href="index.html" class="btn-logout" style="text-decoration: none; margin-left: 10px;">🏠 אתר ראשי</a>
            <button class="btn-logout" onclick="logout()">התנתק</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Tabs Navigation -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
                📊 סקירה כללית
            </button>
            <button class="admin-tab" data-tab="calendar" onclick="switchTab('calendar')">
                📅 לוח שנה
            </button>
            <button class="admin-tab" data-tab="bookings" onclick="switchTab('bookings')">
                📋 הזמנות
            </button>
        </div>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="admin-section active">
            <div class="loading">טוען נתונים</div>
        </section>

        <!-- Calendar Section -->
        <section id="calendar-section" class="admin-section">
            <div class="loading">טוען לוח שנה</div>
        </section>

        <!-- Bookings Section -->
        <section id="bookings-section" class="admin-section">
            <div class="loading">טוען הזמנות</div>
        </section>
    </main>

    <!-- Edit Booking Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>ערוך הזמנה</h2>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <form id="editBookingForm">
                <input type="hidden" id="editBookingId">
                
                <div class="booking-details">
                    <!-- Customer Details Section -->
                    <div class="detail-section">
                        <h3>פרטי לקוח</h3>
                        <div class="form-group">
                            <label>שם לקוח</label>
                            <input type="text" id="editCustomerName" required>
                        </div>

                        <div class="form-group">
                            <label>אימייל</label>
                            <input type="email" id="editCustomerEmail" required>
                        </div>

                        <div class="form-group">
                            <label>טלפון</label>
                            <input type="tel" id="editCustomerPhone" required>
                        </div>
                    </div>

                    <!-- Booking Details Section -->
                    <div class="detail-section">
                        <h3>פרטי הזמנה</h3>
                        <div class="form-group">
                            <label>תאריך</label>
                            <input type="date" id="editBookingDate" required>
                        </div>

                        <div class="form-group">
                            <label>שעה</label>
                            <input type="time" id="editBookingTime" required>
                        </div>

                        <div class="form-group">
                            <label>סטטוס הזמנה</label>
                            <select id="editStatus">
                                <option value="confirmed">מאושר</option>
                                <option value="completed">הושלם</option>
                                <option value="cancelled">בוטל</option>
                            </select>
                        </div>
                    </div>

                    <!-- Payment Details Section -->
                    <div class="detail-section">
                        <h3>פרטי תשלום</h3>
                        <div class="form-group">
                            <label>סכום ששולם</label>
                            <input type="number" id="editPaymentAmount" step="0.01">
                        </div>

                        <div class="form-group">
                            <label>סטטוס תשלום</label>
                            <select id="editPaymentStatus">
                                <option value="pending">ממתין</option>
                                <option value="paid">שולם</option>
                                <option value="refunded">הוחזר</option>
                                <option value="failed">נכשל</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>אמצעי תשלום</label>
                            <select id="editPaymentMethod">
                                <option value="">לא צוין</option>
                                <option value="credit_card">כרטיס אשראי</option>
                                <option value="cash">מזומן</option>
                                <option value="bank_transfer">העברה בנקאית</option>
                                <option value="bit">Bit</option>
                                <option value="paypal">PayPal</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>מזהה עסקה</label>
                            <input type="text" id="editPaymentTransactionId">
                        </div>
                    </div>

                    <!-- Notes Section -->
                    <div class="detail-section">
                        <h3>הערות</h3>
                        <div class="form-group">
                            <label>הערות לקוח</label>
                            <textarea id="editCustomerNotes" readonly></textarea>
                        </div>

                        <div class="form-group">
                            <label>הערות מנהל</label>
                            <textarea id="editAdminNotes" placeholder="הוסף הערות פנימיות..."></textarea>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">ביטול</button>
                        <button type="submit" class="btn btn-primary">שמור שינויים</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- View Booking Details Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>פרטי הזמנה</h2>
                <button class="modal-close" onclick="closeViewModal()">×</button>
            </div>
            <div id="viewModalContent"></div>
        </div>
    </div>

    <!-- Create New Booking Modal -->
    <div id="createBookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>צור הזמנה חדשה</h2>
                <button class="modal-close" onclick="closeCreateBookingModal()">×</button>
            </div>
            <form id="createBookingForm">
                <div class="booking-details">
                    <!-- Customer Details Section -->
                    <div class="detail-section">
                        <h3>פרטי לקוח</h3>
                        <div class="form-group">
                            <label>שם לקוח *</label>
                            <input type="text" id="createCustomerName" required>
                        </div>

                        <div class="form-group">
                            <label>אימייל *</label>
                            <input type="email" id="createCustomerEmail" required>
                        </div>

                        <div class="form-group">
                            <label>טלפון *</label>
                            <input type="tel" id="createCustomerPhone" required>
                        </div>
                    </div>

                    <!-- Booking Details Section -->
                    <div class="detail-section">
                        <h3>פרטי הזמנה</h3>
                        <div class="form-group">
                            <label>חבילה *</label>
                            <select id="createPackageId" required onchange="updatePackagePrice(this.value)">
                                <option value="">בחר חבילה</option>
                                <optgroup label="חדר זעם">
                                    <option value="solo-rage-basic" data-price="120">חדר זעם - בסיסי (₪120)</option>
                                    <option value="solo-rage-standard" data-price="150">חדר זעם - סטנדרט (₪150)</option>
                                    <option value="solo-rage-premium" data-price="180">חדר זעם - פרימיום (₪180)</option>
                                    <option value="solo-rage-extreme" data-price="210">חדר זעם - מוגזם (₪210)</option>
                                </optgroup>
                                <optgroup label="זריקת גרזנים">
                                    <option value="solo-axes-basic" data-price="100">זריקת גרזנים - בסיסי (₪100)</option>
                                    <option value="solo-axes-standard" data-price="130">זריקת גרזנים - סטנדרט (₪130)</option>
                                    <option value="solo-axes-premium" data-price="160">זריקת גרזנים - פרימיום (₪160)</option>
                                    <option value="solo-axes-extreme" data-price="190">זריקת גרזנים - מוגזם (₪190)</option>
                                </optgroup>
                                <optgroup label="חדר צבע">
                                    <option value="solo-paint-basic" data-price="140">חדר צבע - בסיסי (₪140)</option>
                                    <option value="solo-paint-standard" data-price="170">חדר צבע - סטנדרט (₪170)</option>
                                    <option value="solo-paint-premium" data-price="200">חדר צבע - פרימיום (₪200)</option>
                                    <option value="solo-paint-extreme" data-price="230">חדר צבע - מוגזם (₪230)</option>
                                </optgroup>
                                <optgroup label="משולב">
                                    <option value="solo-combo-basic" data-price="280">משולב - בסיסי (₪280)</option>
                                    <option value="solo-combo-standard" data-price="350">משולב - סטנדרט (₪350)</option>
                                    <option value="solo-combo-premium" data-price="390">משולב - פרימיום (₪390)</option>
                                    <option value="solo-combo-extreme" data-price="420">משולב - מוגזם (₪420)</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>תאריך *</label>
                            <input type="date" id="createBookingDate" required>
                        </div>

                        <div class="form-group">
                            <label>שעה *</label>
                            <input type="time" id="createBookingTime" required>
                        </div>
                        
                        <div class="form-group">
                            <label>משך (דקות)</label>
                            <input type="number" id="createDuration" value="60" min="30" step="30">
                        </div>
                    </div>

                    <!-- Payment Details Section -->
                    <div class="detail-section">
                        <h3>פרטי תשלום</h3>
                        <div class="form-group">
                            <label>מחיר *</label>
                            <input type="number" id="createPrice" step="0.01" required>
                        </div>

                        <div class="form-group">
                            <label>סטטוס תשלום</label>
                            <select id="createPaymentStatus">
                                <option value="pending">ממתין</option>
                                <option value="paid">שולם</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>אמצעי תשלום</label>
                            <select id="createPaymentMethod">
                                <option value="">לא צוין</option>
                                <option value="credit_card">כרטיס אשראי</option>
                                <option value="cash">מזומן</option>
                                <option value="bank_transfer">העברה בנקאית</option>
                            </select>
                        </div>
                    </div>

                    <!-- Notes Section -->
                    <div class="detail-section">
                        <h3>הערות</h3>
                        <div class="form-group">
                            <label>הערות לקוח</label>
                            <textarea id="createCustomerNotes" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label>הערות מנהל</label>
                            <textarea id="createAdminNotes" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateBookingModal()">ביטול</button>
                    <button type="submit" class="btn btn-primary">צור הזמנה</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-calendar.js"></script>
    <script src="js/admin-bookings.js"></script>
    
    <script>
        // Tab Switching
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Update sections
            document.querySelectorAll('.admin-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(`${tabName}-section`).classList.add('active');

            // Load section data
            if (tabName === 'dashboard' && typeof loadDashboard === 'function') {
                loadDashboard();
            } else if (tabName === 'calendar' && typeof loadCalendar === 'function') {
                loadCalendar();
            } else if (tabName === 'bookings' && typeof loadBookings === 'function') {
                loadBookings();
            }
        }

        // Logout
        function logout() {
            if (confirm('האם אתה בטוח שברצונך להתנתק?')) {
                // Clear admin session from both storages
                sessionStorage.removeItem('smashlabs_admin_token');
                sessionStorage.removeItem('smashlabs_admin_logged_in');
                sessionStorage.removeItem('smashlabs_current_user');
                
                localStorage.removeItem('smashlabs_admin_logged_in');
                localStorage.removeItem('smashlabs_current_user');
                
                console.log('Admin logged out');
                window.location.href = 'login.html';
            }
        }

        // Check authentication
        function checkAuth() {
            // Check both storages for admin status
            const isAdminSession = sessionStorage.getItem('smashlabs_admin_logged_in') === 'true';
            const isAdminLocal = localStorage.getItem('smashlabs_admin_logged_in') === 'true';
            const currentUser = JSON.parse(sessionStorage.getItem('smashlabs_current_user') || localStorage.getItem('smashlabs_current_user') || '{}');
            
            const isAdmin = isAdminSession || isAdminLocal || currentUser.is_admin === true;
            
            console.log('Admin auth check:', { isAdminSession, isAdminLocal, currentUser, isAdmin });
            
            if (!isAdmin) {
                alert('אין לך הרשאות גישה לעמוד זה. נדרשת הרשאת מנהל.');
                window.location.href = 'login.html';
                return false;
            }
            
            // Set admin name from either storage
            const userData = JSON.parse(sessionStorage.getItem('smashlabs_current_user') || localStorage.getItem('smashlabs_current_user') || '{}');
            if (userData.name) {
                document.getElementById('adminName').textContent = userData.name;
            } else {
                document.getElementById('adminName').textContent = 'מנהל';
            }
            
            return true;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                // Load initial dashboard
                loadDashboard();
                
                // Setup edit form submission
                const editForm = document.getElementById('editBookingForm');
                if (editForm) {
                    editForm.addEventListener('submit', async function(e) {
                        e.preventDefault();
                        
                        const bookingId = document.getElementById('editBookingId').value;
                        const updateData = {
                            customer_name: document.getElementById('editCustomerName').value,
                            customer_email: document.getElementById('editCustomerEmail').value,
                            customer_phone: document.getElementById('editCustomerPhone').value,
                            booking_date: document.getElementById('editBookingDate').value,
                            booking_time: document.getElementById('editBookingTime').value,
                            status: document.getElementById('editStatus').value,
                            payment_status: document.getElementById('editPaymentStatus').value,
                            payment_method: document.getElementById('editPaymentMethod').value,
                            payment_amount: parseFloat(document.getElementById('editPaymentAmount').value) || null,
                            payment_transaction_id: document.getElementById('editPaymentTransactionId').value,
                            admin_notes: document.getElementById('editAdminNotes').value
                        };
                        
                        try {
                            const response = await fetch(`http://localhost:8000/api/calendar/bookings/${bookingId}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(updateData)
                            });
                            
                            if (!response.ok) throw new Error('Failed to update booking');
                            
                            alert('ההזמנה עודכנה בהצלחה!');
                            closeEditModal();
                            
                            // Reload current view
                            const activeTab = document.querySelector('.admin-tab.active');
                            if (activeTab) {
                                const tabName = activeTab.getAttribute('data-tab');
                                if (tabName === 'dashboard' && typeof loadDashboard === 'function') {
                                    loadDashboard();
                                } else if (tabName === 'calendar' && typeof loadCalendar === 'function') {
                                    loadCalendar();
                                } else if (tabName === 'bookings' && typeof loadBookings === 'function') {
                                    loadBookings();
                                }
                            }
                            
                        } catch (error) {
                            console.error('Error updating booking:', error);
                            alert('שגיאה בעדכון ההזמנה');
                        }
                    });
                }
            }
        });

        // Modal Management
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('active');
        }
        
        function closeCreateBookingModal() {
            document.getElementById('createBookingModal').classList.remove('active');
            document.getElementById('createBookingForm').reset();
        }
        
        function openCreateBookingModal(selectedDate) {
            document.getElementById('createBookingModal').classList.add('active');
            // Set date to selected date or today
            const dateToUse = selectedDate || new Date().toISOString().split('T')[0];
            document.getElementById('createBookingDate').value = dateToUse;
            // Set default time to current hour or 10:00
            const now = new Date();
            const defaultTime = selectedDate ? '10:00' : `${String(now.getHours()).padStart(2, '0')}:00`;
            document.getElementById('createBookingTime').value = defaultTime;
        }
        
        function updatePackagePrice(packageId) {
            const selectElement = document.getElementById('createPackageId');
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const price = selectedOption.getAttribute('data-price');
            if (price) {
                document.getElementById('createPrice').value = price;
            }
        }
        
        // Handle create booking form submission
        document.addEventListener('DOMContentLoaded', function() {
            const createForm = document.getElementById('createBookingForm');
            if (createForm) {
                createForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const packageSelect = document.getElementById('createPackageId');
                    const selectedOption = packageSelect.options[packageSelect.selectedIndex];
                    const packageName = selectedOption.text.split(' (')[0]; // Extract name without price
                    
                    const bookingData = {
                        packageId: document.getElementById('createPackageId').value,
                        packageName: packageName,
                        customerName: document.getElementById('createCustomerName').value,
                        customerEmail: document.getElementById('createCustomerEmail').value,
                        customerPhone: document.getElementById('createCustomerPhone').value,
                        bookingDate: document.getElementById('createBookingDate').value,
                        bookingTime: document.getElementById('createBookingTime').value,
                        durationMinutes: parseInt(document.getElementById('createDuration').value) || 60,
                        price: parseFloat(document.getElementById('createPrice').value),
                        orderId: 'ADM-' + Date.now(),
                        customerNotes: document.getElementById('createCustomerNotes').value,
                        adminNotes: document.getElementById('createAdminNotes').value
                    };
                    
                    try {
                        const response = await fetch('http://localhost:8000/api/calendar/create-booking', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(bookingData)
                        });
                        
                        if (!response.ok) throw new Error('Failed to create booking');
                        
                        const result = await response.json();
                        
                        // Update payment status if needed
                        if (document.getElementById('createPaymentStatus').value === 'paid') {
                            await fetch(`http://localhost:8000/api/calendar/bookings/${result.booking.id}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    payment_status: 'paid',
                                    payment_method: document.getElementById('createPaymentMethod').value,
                                    payment_amount: parseFloat(document.getElementById('createPrice').value)
                                })
                            });
                        }
                        
                        alert('ההזמנה נוצרה בהצלחה!');
                        closeCreateBookingModal();
                        
                        // Reload current view
                        const activeTab = document.querySelector('.admin-tab.active');
                        if (activeTab) {
                            const tabName = activeTab.getAttribute('data-tab');
                            if (tabName === 'dashboard' && typeof loadDashboard === 'function') {
                                loadDashboard();
                            } else if (tabName === 'calendar' && typeof loadCalendar === 'function') {
                                loadCalendar();
                            } else if (tabName === 'bookings' && typeof loadBookings === 'function') {
                                loadBookings();
                            }
                        }
                        
                    } catch (error) {
                        console.error('Error creating booking:', error);
                        alert('שגיאה ביצירת ההזמנה: ' + error.message);
                    }
                });
            }
        });

        // Close modals on outside click
        window.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });
    </script>
</body>
</html>
