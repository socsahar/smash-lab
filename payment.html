    <!-- Console Filter - Block third-party logs -->
    <script>
        (function() {
            const blockedPatterns = [
                'NagishLi', 'nagishli', 'jQuery', 'missing_setting',
                'nl_lang', 'Element:', 'Style:', 'CSSStyleDeclaration',
                'operata', 'pc-override', 'aria-hidden',
                'nagishli-sr-only', 'nagishli-option',
                'לפתוח את התפריט', 'הצהרת נגישות', 'accessibility',
                'sprite.png', 'tl.png', 'tr.png', 'bl.png', 'br.png',
                'Blocked aria-hidden', 'WAI-ARIA', 'w3c.github.io',
                'getElementsByTagName is not a function', 'content_script.js',
                'Fetching batch', 'Scroll check', 'Scroll event fired',
                'Waiver elements', 'Signature captured', 'Email sent',
                'Supabase not ready', 'processWaiver', 'Address data',
                'Sample record', 'Sample cities'
            ];
            
            function shouldBlock(args) {
                const str = JSON.stringify(args);
                return blockedPatterns.some(pattern => 
                    str.toLowerCase().includes(pattern.toLowerCase()));
            }
            
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            const originalInfo = console.info;
            
            console.log = function(...args) {
                if (!shouldBlock(args)) originalLog.apply(console, args);
            };
            console.error = function(...args) {
                if (!shouldBlock(args)) originalError.apply(console, args);
            };
            console.warn = function(...args) {
                if (!shouldBlock(args)) originalWarn.apply(console, args);
            };
            console.info = function(...args) {
                if (!shouldBlock(args)) originalInfo.apply(console, args);
            };
        })();
    </script>

    <script>
        // Load order details from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const orderData = localStorage.getItem('currentOrder');
            
            if (!orderData) {
                if (window.customModal) {
                    window.customModal.error('לא נמצאו פרטי הזמנה. מפנה חזרה לדף ההזמנה...', 'שגיאה').then(() => {
                        window.location.href = 'order.html';
                    });
                } else {
                    alert('לא נמצאו פרטי הזמנה. מפנה חזרה לדף ההזמנה...');
                    window.location.href = 'order.html';
                }
                return;
            }
            
            const order = JSON.parse(orderData);
            
            // Check if waiver was signed
            if (!order.waiverSigned || !order.waiver) {
                if (window.customModal) {
                    window.customModal.warning('חובה לחתום על כתב ויתור לפני התשלום. מפנה לכתב הויתור...', 'כתב ויתור נדרש').then(() => {
                        window.location.href = 'waiver.html';
                    });
                } else {
                    alert('חובה לחתום על כתב ויתור לפני התשלום. מפנה לכתב הויתור...');
                    window.location.href = 'waiver.html';
                }
                return;
            }
            
            displayOrderSummary(order);
            
            // Handle payment method selection
            const paymentMethod = document.getElementById('payment-method');
            const creditCardFields = document.getElementById('credit-card-fields');
            
            paymentMethod.addEventListener('change', function() {
                if (this.value === 'credit-card') {
                    creditCardFields.style.display = 'block';
                } else {
                    creditCardFields.style.display = 'none';
                }
            });
            
            // Handle payment form submission
            document.getElementById('payment-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                await processPayment(order);
            });
            
            // Format card number input
            const cardNumberInput = document.getElementById('card-number');
            if (cardNumberInput) {
                cardNumberInput.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\s/g, '');
                    let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
                    e.target.value = formattedValue;
                });
            }
            
            // Format expiry input
            const expiryInput = document.getElementById('expiry');
            if (expiryInput) {
                expiryInput.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length >= 2) {
                        value = value.substring(0, 2) + '/' + value.substring(2, 4);
                    }
                    e.target.value = value;
                });
            }
        });
        
        // Global variable to track applied coupon
        let appliedCoupon = null;
        
        function displayOrderSummary(order) {
            const serviceNames = {
                'paint-room': 'חדר צבע',
                'rage-room': 'חדר זעם',
                'throwing-axes': 'זריקת גרזנים',
                'graffiti-center': 'מרכז גרפיטי',
                'birthday': 'יום הולדת',
                'rent-lab': 'השכרת מעבדה',
                'combo': 'משולב'
            };
            
            const servicePrices = {
                'paint-room': 120,
                'rage-room': 150,
                'throwing-axes': 100,
                'graffiti-center': 200,
                'birthday': 300,
                'rent-lab': 500,
                'combo': 200
            };
            
            // Get service from order.service or fallback to packageName
            const serviceKey = order.service || order.roomType || 'not-selected';
            const displayName = order.packageName || serviceNames[serviceKey] || serviceKey || 'לא נבחר';
            const basePrice = order.price || servicePrices[serviceKey] || 100;
            const subtotal = basePrice * parseInt(order.quantity || order.participants || 1);
            
            // Calculate discount if coupon applied
            let discount = 0;
            let totalPrice = subtotal;
            if (appliedCoupon) {
                discount = appliedCoupon.discount;
                totalPrice = Math.max(0, subtotal - discount);
            }
            
            const detailsHTML = `
                <div class="price-item">
                    <span><strong>שם:</strong> ${order.name}</span>
                </div>
                <div class="price-item">
                    <span><strong>שירות:</strong> ${displayName}</span>
                    <span>₪${basePrice}</span>
                </div>
                <div class="price-item">
                    <span><strong>כמות משתתפים:</strong> ${order.quantity || order.participants || 1}</span>
                    <span>x${order.quantity || order.participants || 1}</span>
                </div>
                ${order.date ? `<div class="price-item"><span><strong>תאריך:</strong> ${order.date}</span></div>` : ''}
                ${order.notes ? `<div class="price-item"><span><strong>הערות:</strong> ${order.notes}</span></div>` : ''}
                <div class="price-item">
                    <span>סכום ביניים:</span>
                    <span>₪${subtotal}</span>
                </div>
                ${appliedCoupon ? `
                <div class="price-item discount-item">
                    <span>🎟️ הנחה (${appliedCoupon.code}):</span>
                    <span>-₪${discount.toFixed(2)}</span>
                </div>
                ` : ''}
                <div class="price-item total-price">
                    <span>סך הכל לתשלום:</span>
                    <span>₪${totalPrice.toFixed(2)}</span>
                </div>
                <div style="margin-top: 1rem; padding: 1rem; background: #444; border-radius: 5px;">
                    <strong>מספר הזמנה:</strong> ${order.orderId}
                </div>
                ${order.waiver ? `
                <div style="margin-top: 1rem; padding: 1rem; background: #2d5a2d; border-radius: 5px; border: 2px solid #4CAF50;">
                    <h4 style="color: #4CAF50; margin: 0 0 0.5rem 0;">✅ כתב ויתור נחתם</h4>
                    <p style="margin: 0;"><strong>חתום על ידי:</strong> ${order.waiver.fullName}</p>
                    <p style="margin: 0;"><strong>תאריך חתימה:</strong> ${order.waiver.signatureDate}</p>
                </div>
                ` : ''}
            `;
            
            document.getElementById('order-details').innerHTML = detailsHTML;
        }
        
        // Initialize Supabase client
        let supabaseClient = null;
        function initSupabase() {
            if (supabaseClient) return supabaseClient;
            if (typeof supabase === 'undefined' || !window.ENV_CONFIG) {
                console.error('Supabase not available');
                return null;
            }
            supabaseClient = supabase.createClient(
                window.ENV_CONFIG.SUPABASE_URL,
                window.ENV_CONFIG.SUPABASE_ANON_KEY
            );
            return supabaseClient;
        }
        
        async function applyCouponCode() {
            const couponInput = document.getElementById('coupon-code');
            const couponCode = couponInput.value.trim().toUpperCase();
            const messageDiv = document.getElementById('coupon-message');
            
            if (!couponCode) {
                messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ אנא הזן קוד קופון</div>';
                return;
            }
            
            // Get order data to calculate total
            const orderData = localStorage.getItem('currentOrder');
            if (!orderData) {
                messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ שגיאה בטעינת פרטי הזמנה</div>';
                return;
            }
            
            const order = JSON.parse(orderData);
            const servicePrices = {
                'paint-room': 120,
                'rage-room': 150,
                'throwing-axes': 100,
                'graffiti-center': 200,
                'birthday': 300,
                'rent-lab': 500,
                'combo': 200
            };
            
            const serviceKey = order.service || order.roomType || 'not-selected';
            const basePrice = order.price || servicePrices[serviceKey] || 100;
            const orderTotal = basePrice * parseInt(order.quantity || order.participants || 1);
            
            // Initialize Supabase and fetch coupon
            const client = initSupabase();
            if (!client) {
                messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ שגיאה בחיבור למסד הנתונים</div>';
                return;
            }
            
            try {
                // Fetch coupon from Supabase
                const { data: coupon, error } = await client
                    .from('coupons')
                    .select('*')
                    .eq('code', couponCode)
                    .neq('status', 'deleted')
                    .single();
                
                if (error || !coupon) {
                    messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ קוד קופון לא נמצא</div>';
                    return;
                }
                
                if (coupon.status === 'revoked') {
                    messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ קופון זה בוטל</div>';
                    return;
                }
                
                const now = new Date();
                const expiry = new Date(coupon.expiry_date);
                if (expiry < now) {
                    messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ תוקף הקופון פג</div>';
                    return;
                }
                
                if (coupon.max_uses && coupon.used_count >= coupon.max_uses) {
                    messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ הקופון הגיע למכסת השימושים המקסימלית</div>';
                    return;
                }
                
                if (orderTotal < coupon.min_purchase) {
                    messageDiv.innerHTML = `<div class="coupon-message coupon-error">❌ דרושה קניה מינימלית של ₪${coupon.min_purchase}</div>`;
                    return;
                }
                
                // Calculate discount
                let discount = 0;
                if (coupon.type === 'percentage') {
                    discount = (orderTotal * coupon.discount) / 100;
                } else {
                    discount = coupon.discount;
                }
                discount = Math.min(discount, orderTotal);
                
                // Apply coupon
                appliedCoupon = {
                    id: coupon.id,
                    code: coupon.code,
                    discount: discount,
                    type: coupon.type,
                    value: coupon.discount
                };
                
                // Update display
                displayOrderSummary(order);
                
                // Show success message with remove button
                messageDiv.innerHTML = `
                    <div class="coupon-message coupon-success">
                        ✅ קופון הוחל בהצלחה! הנחה של ₪${discount.toFixed(2)}
                        <button type="button" class="btn-remove-coupon" onclick="removeCoupon()" style="margin-right: 10px;">הסר קופון</button>
                    </div>
                `;
                
                // Disable input and apply button
                couponInput.disabled = true;
                document.querySelector('.btn-apply-coupon').disabled = true;
            } catch (err) {
                console.error('Error validating coupon:', err);
                messageDiv.innerHTML = '<div class="coupon-message coupon-error">❌ שגיאה באימות קופון</div>';
            }
        }
        
        function removeCoupon() {
            appliedCoupon = null;
            
            // Re-enable input and apply button
            const couponInput = document.getElementById('coupon-code');
            couponInput.value = '';
            couponInput.disabled = false;
            document.querySelector('.btn-apply-coupon').disabled = false;
            
            // Clear message
            document.getElementById('coupon-message').innerHTML = '';
            
            // Reload order data to refresh display
            const orderData = localStorage.getItem('currentOrder');
            if (orderData) {
                const order = JSON.parse(orderData);
                displayOrderSummary(order);
            }
        }
        
        // Process credit card payment with Verifone
        async function processCreditCardPayment(order) {
            // Validate card inputs
            const cardNumber = document.getElementById('card-number').value.replace(/\s/g, '');
            const expiry = document.getElementById('expiry').value;
            const cvv = document.getElementById('cvv').value;
            
            if (!cardNumber || !expiry || !cvv) {
                if (window.customModal) {
                    window.customModal.warning('אנא מלא את כל פרטי הכרטיס', 'פרטים חסרים');
                } else {
                    alert('אנא מלא את כל פרטי הכרטיס');
                }
                return;
            }
            
            // Validate card number (basic check)
            if (cardNumber.length < 13 || cardNumber.length > 19) {
                if (window.customModal) {
                    window.customModal.error('מספר כרטיס לא תקין', 'שגיאה');
                } else {
                    alert('מספר כרטיס לא תקין');
                }
                return;
            }
            
            // Parse expiry
            const [expiryMonth, expiryYear] = expiry.split('/');
            if (!expiryMonth || !expiryYear || expiryMonth.length !== 2 || expiryYear.length !== 2) {
                if (window.customModal) {
                    window.customModal.error('תאריך תפוגה לא תקין (MM/YY)', 'שגיאה');
                } else {
                    alert('תאריך תפוגה לא תקין');
                }
                return;
            }
            
            const button = document.querySelector('#payment-form button[type="submit"]');
            const originalText = button.textContent;
            button.textContent = 'מעבד תשלום... ⏳';
            button.disabled = true;
            
            try {
                // Initialize Verifone
                if (!window.verifonePayment) {
                    throw new Error('Verifone payment system not loaded');
                }
                
                await window.verifonePayment.init();
                
                // Calculate final amount
                const servicePrices = {
                    'paint-room': 120,
                    'rage-room': 150,
                    'throwing-axes': 100,
                    'graffiti-center': 200,
                    'birthday': 300,
                    'rent-lab': 500,
                    'combo': 200
                };
                const serviceKey = order.service || order.roomType || 'not-selected';
                const basePrice = order.price || servicePrices[serviceKey] || 100;
                const subtotal = basePrice * parseInt(order.quantity || order.participants || 1);
                const finalPrice = appliedCoupon ? Math.max(0, subtotal - appliedCoupon.discount) : subtotal;
                
                // Prepare order data
                const orderData = {
                    orderId: order.orderId || `TEMP-${Date.now()}`,
                    amount: finalPrice,
                    customerName: order.name || order.customerName,
                    customerEmail: order.email || order.customerEmail,
                    customerPhone: order.phone || order.customerPhone,
                    description: `${order.packageName || order.serviceName || 'SmashLabs Booking'}`,
                    packageId: order.packageId || order.service,
                    packageName: order.packageName || order.serviceName,
                    date: order.date,
                    time: order.time,
                    duration: order.duration || 60
                };
                
                // Prepare card data
                const cardData = {
                    number: cardNumber,
                    expiryMonth: expiryMonth,
                    expiryYear: '20' + expiryYear,
                    cvv: cvv
                };
                
                // Process payment
                const result = await window.verifonePayment.processPayment(cardData, orderData);
                
                if (result.success) {
                    // Save to Supabase
                    try {
                        const savedBooking = await window.verifonePayment.saveBookingToDatabase(orderData, result);
                        console.log('✅ Booking saved:', savedBooking);
                        
                        // Update order with actual database ID
                        order.dbOrderId = savedBooking.id;
                        order.orderId = String(savedBooking.id).padStart(5, '0');
                    } catch (dbError) {
                        console.error('⚠️ Database save error:', dbError);
                        // Continue even if DB save fails - payment succeeded
                    }
                    
                    // Track coupon usage
                    if (appliedCoupon) {
                        try {
                            const client = initSupabase();
                            await client.from('coupon_usage').insert([{
                                coupon_id: appliedCoupon.id,
                                customer_email: order.email,
                                order_amount: subtotal,
                                discount_amount: appliedCoupon.discount,
                                order_id: order.orderId
                            }]);
                        } catch (err) {
                            console.error('Error tracking coupon:', err);
                        }
                    }
                    
                    // Save completed order
                    localStorage.setItem('completedOrder', JSON.stringify({
                        ...order,
                        paymentMethod: 'credit-card',
                        paymentDate: new Date().toISOString(),
                        status: 'paid',
                        transactionId: result.transactionId,
                        coupon: appliedCoupon ? {
                            code: appliedCoupon.code,
                            discount: appliedCoupon.discount
                        } : null,
                        originalPrice: subtotal,
                        finalPrice: finalPrice
                    }));
                    
                    // Success message
                    if (window.customModal) {
                        window.customModal.show({
                            title: 'תשלום בוצע בהצלחה! 🎉',
                            message: `התשלום אושר במערכת.\nמספר הזמנה: ${order.orderId}\nמעביר לסיכום ההזמנה...`,
                            showCloseButton: false
                        });
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'order-success.html';
                    }, 2000);
                    
                } else {
                    throw new Error('Payment failed');
                }
                
            } catch (error) {
                console.error('❌ Payment error:', error);
                button.textContent = originalText;
                button.disabled = false;
                
                if (window.customModal) {
                    window.customModal.error(
                        'התשלום נכשל. אנא בדוק את פרטי הכרטיס ונסה שוב.',
                        'שגיאה בתשלום'
                    );
                } else {
                    alert('התשלום נכשל. אנא נסה שוב.');
                }
            }
        }

                    alert('אנא בחר אמצעי תשלום');
                }
                return;
            }
            
            // Handle credit card payment with Verifone
            if (paymentMethod === 'credit-card') {
                await processCreditCardPayment(order);
                return;
            }
            
            // Handle credit card payment with Verifone
            if (paymentMethod === 'credit-card') {

                return;

                }
                
                // Calculate final price with discount
                const servicePrices = {

                    'birthday': 300,
                    'rent-lab': 500,
                    'combo': 200
                };
                const serviceKey = order.service || order.roomType || 'not-selected';
                const basePrice = order.price || servicePrices[serviceKey] || 100;
                const subtotal = basePrice * parseInt(order.quantity || order.participants || 1);
                const finalPrice = appliedCoupon ? Math.max(0, subtotal - appliedCoupon.discount) : subtotal;
                
                // Simulate successful payment
                localStorage.setItem('completedOrder', JSON.stringify({
                    ...order,
                    paymentMethod: paymentMethod,
                    paymentDate: new Date().toISOString(),
                    status: 'paid',
                    coupon: appliedCoupon ? {
                        code: appliedCoupon.code,
                        discount: appliedCoupon.discount,
                        type: appliedCoupon.type,
                        value: appliedCoupon.value
                    } : null,
                    originalPrice: subtotal,
                    finalPrice: finalPrice
                }));
                
                if (window.customModal) {
                    // Show modal without close button
                    window.customModal.show({
                        title: 'תשלום בוצע! 🎉',
                        message: 'התשלום בוצע בהצלחה!\n\nמפנה לדף אישור...',
                        type: 'success',
                        icon: '✅',
                        showCloseButton: false,
                        buttons: []
                    });
                    
                    // Auto-redirect after 5 seconds
                    setTimeout(() => {
                        window.location.href = 'order-success.html';
                    }, 5000);
                } else {
                    alert('התשלום בוצע בהצלחה! מפנה לדף אישור...');
                    setTimeout(() => {
                        window.location.href = 'order-success.html';
                    }, 5000);
                }
            }, 2000);
        }
        
        function goBack() {
            window.location.href = 'waiver.html';
        }
    </script>
