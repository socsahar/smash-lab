<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>תשלום - SmashLabs</title>
    <meta name="description" content="השלמת תהליך התשלום לשירותי SmashLabs">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/nagishli.css">
    <link rel="stylesheet" href="css/whatsapp-widget.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/custom-modal.css">

    <!-- Preload and load fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Fallback styles for payment page -->
    <style>
        /* Fallback styles if main CSS fails to load */
        body { 
            font-family: 'Heebo', 'Rubik', Arial, sans-serif; 
            background: #1a1a1a; 
            color: #fff; 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #222;
        }
        .logo { color: #ff6b00; font-size: 1.5rem; text-decoration: none; font-weight: bold; }
        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 1rem; 
            margin: 0; 
            padding: 0; 
        }
        .nav-links a { 
            color: #fff; 
            text-decoration: none; 
            padding: 0.5rem 1rem; 
        }
        .nav-links a:hover { color: #ff6b00; }
        .hero { 
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%); 
            padding: 4rem 2rem; 
            text-align: center; 
        }
        .hero h1 { 
            font-size: 2.5rem; 
            margin-bottom: 1rem; 
            color: #ff6b00; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 2rem; 
        }
        .card { 
            background: #222; 
            border-radius: 10px; 
            padding: 2rem; 
            margin: 2rem 0; 
        }
        .payment-summary {
            background: #333;
            border: 2px solid #ff6b00;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
        }
        .total-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6b00;
            border-top: 2px solid #555;
            padding-top: 1rem;
            margin-top: 1rem;
        }
        .form-group { 
            margin-bottom: 1.5rem; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: #ff6b00; 
            font-weight: bold; 
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #444; 
            background: #333; 
            color: #fff; 
            border-radius: 5px; 
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn { 
            background: linear-gradient(45deg, #ff6b00, #1fb6c2); 
            color: #fff; 
            padding: 1rem 2rem; 
            border: none; 
            border-radius: 5px; 
            font-size: 1rem; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            margin: 0.5rem;
        }
        .btn-secondary {
            background: #555;
        }
        .hamburger { display: none; }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hamburger { display: block; }
        }
    </style>
    
    <!-- NagishLi Accessibility Plugin Configuration -->
    <script>
        window.NagishLiConfig = {
            'nlService': 'nagishli',
            'nlPurchaseUrl': '',
            'nlCustomCss': '',
            'nlIgnore': ['img', 'video', 'audio', 'canvas'],
            'nlLang': 'he',
            'nlCustomText': {
                'accessibilitySymbol': 'נגישות',
                'mainMenu': 'תפריט נגישות ראשי',
                'submenu': 'תפריט משנה',
                'imageAlt': 'תמונה ללא תיאור',
                'skipToMain': 'דלג לתוכן הראשי',
                'increaseText': 'הגדל טקסט',
                'decreaseText': 'הקטן טקסט',
                'increaseTextSpacing': 'הגדל ריווח בין אותיות',
                'decreaseTextSpacing': 'הקטן ריווח בין אותיות',
                'increaseLineHeight': 'הגדל גובה שורה',
                'decreaseLineHeight': 'הקטן גובה שורה',
                'invertColors': 'הפוך צבעים',
                'grayHues': 'גווני אפור',
                'underlineLinks': 'הדגש קישורים',
                'bigCursor': 'סמן גדול',
                'readingGuide': 'מדריך קריאה',
                'textToSpeech': 'הקראת טקסט',
                'speechToText': 'דיבור לטקסט',
                'screenReader': 'קורא מסך',
                'highContrast': 'ניגודיות גבוהה',
                'resetSettings': 'איפוס הגדרות',
                'close': 'סגור'
            }
        };
    </script>
    <nagishli></nagishli>
    <script src="js/nagishli.js"></script>
    <script src="js/header-inject.js"></script>
</head>

<body>
    <div id="site-header"></div>

    <!-- Main Content -->
    <main id="main-content" tabindex="-1" role="main" style="padding-top: 120px !important;">
        <!-- Hero Section -->
        <section class="hero" aria-label="הירו תשלום">
            <div class="hero-content fade-in">
                <h1 class="graffiti-text">השלמת תשלום</h1>
                <p class="graffiti-text">כמעט סיימנו! אשר את פרטי ההזמנה ובצע תשלום</p>
            </div>
        </section>

        <!-- Payment Section -->
        <section class="section fade-in" id="payment">
            <div class="container">
                <h2 class="section-title graffiti-text">סיכום הזמנה</h2>
                
                <div class="card" style="max-width: 700px; margin: 0 auto;">
                    <!-- Order Summary -->
                    <div id="order-summary" class="payment-summary">
                        <h3 style="color: #ff6b00; margin-bottom: 1rem;">פרטי ההזמנה</h3>
                        <div id="order-details">
                            <!-- Order details will be loaded here by JavaScript -->
                        </div>
                    </div>

                    <!-- Payment Form -->
                    <form id="payment-form">
                        <h3 style="color: #ff6b00; margin-bottom: 1rem;">פרטי תשלום</h3>
                        
                        <div class="form-group">
                            <label for="payment-method">אמצעי תשלום</label>
                            <select id="payment-method" name="payment-method" required>
                                <option value="">בחר אמצעי תשלום</option>
                                <option value="credit-card">כרטיס אשראי</option>
                                <option value="paypal">PayPal</option>
                                <option value="bit">Bit</option>
                                <option value="bank-transfer">העברה בנקאית</option>
                            </select>
                        </div>

                        <div id="credit-card-fields" style="display: none;">
                            <div class="form-group">
                                <label for="card-number">מספר כרטיס</label>
                                <input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456">
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label for="expiry">תוקף</label>
                                    <input type="text" id="expiry" name="expiry" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" name="cvv" placeholder="123">
                                </div>
                            </div>
                        </div>

                        <div style="text-align: center; margin-top: 2rem;">
                            <button type="button" class="btn btn-secondary" onclick="goBack()">חזור להזמנה</button>
                            <button type="submit" class="btn">המשך לתשלום</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer role="contentinfo">
        <div class="footer-inner">
            <p class="graffiti-text" style="font-size: 1.5rem; margin-bottom: 1rem;">SmashLabs - המקום לשחרר לחצים!</p>
            <p>כל הזכויות שמורות © 2025</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/custom-modal.js"></script>
    <script src="scripts.js"></script>
    <script src="js/nagishli.js"></script>
    <script src="js/whatsapp-widget.js"></script>
    
    <script>
        // Load order details from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const orderData = localStorage.getItem('currentOrder');
            
            if (!orderData) {
                if (window.customModal) {
                    window.customModal.error('לא נמצאו פרטי הזמנה. מפנה חזרה לדף ההזמנה...', 'שגיאה').then(() => {
                        window.location.href = 'order.html';
                    });
                } else {
                    alert('לא נמצאו פרטי הזמנה. מפנה חזרה לדף ההזמנה...');
                    window.location.href = 'order.html';
                }
                return;
            }
            
            const order = JSON.parse(orderData);
            
            // Check if waiver was signed
            if (!order.waiverSigned || !order.waiver) {
                if (window.customModal) {
                    window.customModal.warning('חובה לחתום על כתב ויתור לפני התשלום. מפנה לכתב הויתור...', 'כתב ויתור נדרש').then(() => {
                        window.location.href = 'waiver.html';
                    });
                } else {
                    alert('חובה לחתום על כתב ויתור לפני התשלום. מפנה לכתב הויתור...');
                    window.location.href = 'waiver.html';
                }
                return;
            }
            
            displayOrderSummary(order);
            
            // Handle payment method selection
            const paymentMethod = document.getElementById('payment-method');
            const creditCardFields = document.getElementById('credit-card-fields');
            
            paymentMethod.addEventListener('change', function() {
                if (this.value === 'credit-card') {
                    creditCardFields.style.display = 'block';
                } else {
                    creditCardFields.style.display = 'none';
                }
            });
            
            // Handle payment form submission
            document.getElementById('payment-form').addEventListener('submit', function(e) {
                e.preventDefault();
                processPayment(order);
            });
        });
        
        function displayOrderSummary(order) {
            const serviceNames = {
                'paint-room': 'חדר צבע',
                'rage-room': 'חדר זעם',
                'throwing-axes': 'זריקת גרזנים',
                'graffiti-center': 'מרכז גרפיטי',
                'birthday': 'יום הולדת',
                'rent-lab': 'השכרת מעבדה',
                'combo': 'משולב'
            };
            
            const servicePrices = {
                'paint-room': 120,
                'rage-room': 150,
                'throwing-axes': 100,
                'graffiti-center': 200,
                'birthday': 300,
                'rent-lab': 500,
                'combo': 200
            };
            
            // Get service from order.service or fallback to packageName
            const serviceKey = order.service || order.roomType || 'not-selected';
            const displayName = order.packageName || serviceNames[serviceKey] || serviceKey || 'לא נבחר';
            const basePrice = order.price || servicePrices[serviceKey] || 100;
            const totalPrice = basePrice * parseInt(order.quantity || order.participants || 1);
            
            const detailsHTML = `
                <div class="price-item">
                    <span><strong>שם:</strong> ${order.name}</span>
                </div>
                <div class="price-item">
                    <span><strong>שירות:</strong> ${displayName}</span>
                    <span>₪${basePrice}</span>
                </div>
                <div class="price-item">
                    <span><strong>כמות משתתפים:</strong> ${order.quantity || order.participants || 1}</span>
                    <span>x${order.quantity || order.participants || 1}</span>
                </div>
                ${order.date ? `<div class="price-item"><span><strong>תאריך:</strong> ${order.date}</span></div>` : ''}
                ${order.notes ? `<div class="price-item"><span><strong>הערות:</strong> ${order.notes}</span></div>` : ''}
                <div class="price-item total-price">
                    <span>סך הכל:</span>
                    <span>₪${totalPrice}</span>
                </div>
                <div style="margin-top: 1rem; padding: 1rem; background: #444; border-radius: 5px;">
                    <strong>מספר הזמנה:</strong> ${order.orderId}
                </div>
                ${order.waiver ? `
                <div style="margin-top: 1rem; padding: 1rem; background: #2d5a2d; border-radius: 5px; border: 2px solid #4CAF50;">
                    <h4 style="color: #4CAF50; margin: 0 0 0.5rem 0;">✅ כתב ויתור נחתם</h4>
                    <p style="margin: 0;"><strong>חתום על ידי:</strong> ${order.waiver.fullName}</p>
                    <p style="margin: 0;"><strong>תאריך חתימה:</strong> ${order.waiver.signatureDate}</p>
                </div>
                ` : ''}
            `;
            
            document.getElementById('order-details').innerHTML = detailsHTML;
        }
        
        function processPayment(order) {
            const paymentMethod = document.getElementById('payment-method').value;
            
            if (!paymentMethod) {
                if (window.customModal) {
                    window.customModal.warning('אנא בחר אמצעי תשלום', 'חסר אמצעי תשלום');
                } else {
                    alert('אנא בחר אמצעי תשלום');
                }
                return;
            }
            
            // Simulate payment processing
            const processingMessage = 'מעבד תשלום...';
            const button = document.querySelector('#payment-form button[type="submit"]');
            const originalText = button.textContent;
            button.textContent = processingMessage;
            button.disabled = true;
            
            setTimeout(() => {
                // Simulate successful payment
                localStorage.setItem('completedOrder', JSON.stringify({
                    ...order,
                    paymentMethod: paymentMethod,
                    paymentDate: new Date().toISOString(),
                    status: 'paid'
                }));
                
                if (window.customModal) {
                    // Show modal without close button
                    window.customModal.show({
                        title: 'תשלום בוצע! 🎉',
                        message: 'התשלום בוצע בהצלחה!\n\nמפנה לדף אישור...',
                        type: 'success',
                        icon: '✅',
                        showCloseButton: false,
                        buttons: []
                    });
                    
                    // Auto-redirect after 5 seconds
                    setTimeout(() => {
                        window.location.href = 'order-success.html';
                    }, 5000);
                } else {
                    alert('התשלום בוצע בהצלחה! מפנה לדף אישור...');
                    setTimeout(() => {
                        window.location.href = 'order-success.html';
                    }, 5000);
                }
            }, 2000);
        }
        
        function goBack() {
            window.location.href = 'waiver.html';
        }
    </script>
    <script src="js/user-auth.js"></script>
</body>

</html>
